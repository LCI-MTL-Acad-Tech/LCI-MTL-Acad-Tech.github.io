  font-weight: 700; font-display: swap;
}

/* === TOKENS === */
:root {
  --blue: #00587c; --blue-dark: #00435e; --blue-dim: #c8dde6;
  --red: #eb2d37; --cobalt: #685ef7; --taupe: #cdc19e;
  --radius: 6px; --duration: .25s; --ease: cubic-bezier(.4,.14,.3,1);

  --bg: #ffffff; --bg-alt: #f8f5e9; --bg-alt2: #ede9d8; --surface: #ffffff;
  --border: #e1e3e4;
  --text: #07181e; --text-2: #424f54; --text-3: #576266; --text-4: #6d7478; --text-5: #9ca3a5; --text-6: #babfc0;

  --accent: #00587c; --accent-dark: #00435e;
  --hero-bg: #00587c; --hero-fg: #ffffff;
  --header-bg: #07181e; --header-text: #ffffff; --header-muted: #babfc0;
  --on-accent: #ffffff;

  --tag-must: #c71f29;  --tag-must-bg: rgba(235,45,55,.10);
  --tag-tip: #4a7000;   --tag-tip-bg: rgba(91,128,0,.12);
  --warn: #7a5a00;      --warn-bg: #fbf0da; --warn-border: #e4c077;
  --ok-bg: #eef5e0;     --ok-border: #b9d58a; --ok-text: #3b5a00;

  --s1: #00587c; --s1-fg: #ffffff;
  --s2: #685ef7; --s2-fg: #ffffff;
  --s3: #4a7000; --s3-fg: #ffffff;
  --s4: #cdc19e; --s4-fg: #07181e;
  --s5: #c71f29; --s5-fg: #ffffff;
}
html[data-theme="dark"] {
  --bg: #0e1a1f; --bg-alt: #152028; --bg-alt2: #1c2d36; --surface: #1a2c35;
  --border: #2a3d47;
  --text: #dce8ec; --text-2: #b0c4cc; --text-3: #8fa8b2; --text-4: #6e8c96; --text-5: #4e6870; --text-6: #3a5058;

  --accent: #3a9bc4; --accent-dark: #79c4e4;
  --hero-bg: #0d3a4c; --hero-fg: #ffffff;
  --header-bg: #050d11; --header-text: #dce8ec; --header-muted: #8fa8b2;
  --on-accent: #07181e;
  --blue-dim: #1a3a4a;

  --tag-must: #ff8a91;  --tag-must-bg: rgba(235,45,55,.18);
  --tag-tip: #8fd13a;   --tag-tip-bg: rgba(122,184,48,.16);
  --warn: #e8b54d;      --warn-bg: #3a2f14; --warn-border: #6b5423;
  --ok-bg: #1d2e14;     --ok-border: #3f5f20; --ok-text: #a9dd6a;

  --s1: #5bb3d6; --s1-fg: #07181e;
  --s2: #9a93ff; --s2-fg: #07181e;
  --s3: #9ccf4f; --s3-fg: #07181e;
  --s4: #cdc19e; --s4-fg: #07181e;
  --s5: #ff8a91; --s5-fg: #07181e;
}

/* === BASE === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 62.5%; scroll-behavior: smooth; }
body {
  font-family: 'Modern Gothic', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 1.6rem; line-height: 1.5; color: var(--text); background: var(--bg-alt); min-height: 100vh;
}
a { color: var(--accent); }
button { font-family: inherit; }

/* === HEADER === */
.site-header {
  background: var(--header-bg); padding: 1.6rem 2.4rem; position: sticky; top: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between; gap: 1.6rem; flex-wrap: wrap;
}
.site-header__wordmark {
  flex: 1; font-size: 1.3rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--header-muted);
}
.site-header__wordmark strong { color: var(--header-text); font-weight: 700; }
.site-header__controls { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
.lang-toggle { display: flex; background: rgba(255,255,255,.10); border-radius: 4px; overflow: hidden; }
.lang-btn {
  padding: .5rem 1.2rem; font-size: 1.3rem; font-weight: 500; letter-spacing: .05em;
  background: none; border: none; color: var(--header-muted); cursor: pointer;
  transition: background var(--duration) var(--ease), color var(--duration) var(--ease);
}
.lang-btn.active { background: var(--accent); color: var(--on-accent); }
.lang-btn:hover:not(.active) { background: rgba(255,255,255,.15); color: var(--header-text); }
.theme-toggle {
  display: flex; align-items: center; gap: .6rem; background: none; border: 1.5px solid rgba(255,255,255,.3);
  border-radius: 20px; padding: .35rem 1.1rem; cursor: pointer; font-size: 1.3rem; color: var(--header-text);
  transition: border-color var(--duration) var(--ease);
}
.theme-toggle:hover { border-color: rgba(255,255,255,.7); }
.btn-home {
  display: inline-flex; gap: .5rem; align-items: center; font-size: 1.3rem; font-weight: 500;
  color: var(--header-text); text-decoration: none; padding: .35rem 1rem; border-radius: 4px;
}
.btn-home:hover { background: rgba(255,255,255,.12); }

/* === HERO === */
.hero { background: var(--hero-bg); color: var(--hero-fg); padding: 4rem 2.4rem 3.2rem; }
.hero__inner { max-width: 1000px; margin: 0 auto; }
.hero__eyebrow { font-size: 1.2rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.65); margin-bottom: .8rem; }
.hero__title { font-size: clamp(2.8rem, 5vw, 4.4rem); font-weight: 400; letter-spacing: -.03em; line-height: 1; margin-bottom: 1.2rem; }
.hero__title em { font-style: normal; color: rgba(255,255,255,.6); }
.hero__sub { font-size: 1.5rem; color: rgba(255,255,255,.8); max-width: 56ch; line-height: 1.5; }

/* === LAYOUT === */
.wrap { max-width: 1000px; margin: 0 auto; background: var(--bg); min-height: 60vh; }
.tab-bar {
  display: flex; border-bottom: 1.5px solid var(--border); background: var(--bg);
  position: sticky; top: 56px; z-index: 100; overflow-x: auto;
}
.tab-btn {
  flex: 1 0 auto; min-width: 12rem; padding: 1.2rem 1.6rem; font-size: 1.4rem; font-weight: 500; text-align: left;
  background: none; border: none; border-bottom: 3px solid transparent; color: var(--text-3); cursor: pointer;
  display: flex; flex-direction: column; gap: .2rem; transition: all var(--duration) var(--ease);
}
.tab-btn:hover { background: var(--bg-alt); color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-count { font-size: 1.15rem; font-weight: 500; color: var(--text-4); letter-spacing: .03em; }
.tab-btn.complete .tab-count { color: var(--tag-tip); }

.tab-panel { display: none; padding: 3.2rem 2.4rem 4rem; animation: fadeIn .2s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1.6rem; margin-bottom: 2.4rem; flex-wrap: wrap; }
.panel-title { font-size: 2rem; font-weight: 400; letter-spacing: -.02em; }
.panel-desc { font-size: 1.4rem; color: var(--text-3); margin-top: .4rem; max-width: 58ch; line-height: 1.5; }
.panel-actions { display: flex; gap: .8rem; }
.btn-ghost {
  padding: .8rem 1.6rem; font-size: 1.3rem; font-weight: 500; background: none; border: 1.5px solid var(--text-6);
  border-radius: 4px; color: var(--text-3); cursor: pointer; white-space: nowrap; transition: all var(--duration) var(--ease);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-ghost.danger:hover { border-color: var(--red); color: var(--tag-must); background: var(--tag-must-bg); }

/* === PROGRESS === */
.progress-label { font-size: 1.2rem; font-weight: 500; color: var(--text-4); letter-spacing: .04em; margin-bottom: .8rem; display: flex; justify-content: space-between; }
.progress-bar-wrap { background: var(--border); border-radius: 3px; height: 4px; margin-bottom: 2.8rem; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s var(--ease); }

/* === TIME BUDGET (visuel principal) === */
.budget { border: 1.5px solid var(--border); border-radius: var(--radius); padding: 2rem; margin-bottom: 2.8rem; background: var(--surface); }
.budget__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.6rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
.budget__title { font-size: 1.5rem; font-weight: 700; }
.budget__desc { font-size: 1.3rem; color: var(--text-3); margin-top: .3rem; max-width: 52ch; }
.seg-group { display: inline-flex; border: 1.5px solid var(--border); border-radius: 4px; overflow: hidden; }
.seg-btn { padding: .6rem 1.2rem; font-size: 1.3rem; font-weight: 500; background: var(--bg); color: var(--text-3); border: none; border-right: 1px solid var(--border); cursor: pointer; }
.seg-btn:last-child { border-right: none; }
.seg-btn:hover { background: var(--bg-alt); }
.seg-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.budget__note { font-size: 1.3rem; color: var(--text-2); background: var(--bg-alt); border-left: 3px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; padding: 1rem 1.4rem; margin-bottom: 1.4rem; line-height: 1.5; }
.budget__caption { font-size: 1.25rem; color: var(--text-4); margin-bottom: 1.2rem; min-height: 1.8em; }
.bar { display: flex; height: 4.4rem; border-radius: 4px; overflow: hidden; gap: 2px; margin-bottom: 1.6rem; }
.bar__seg { display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 700; min-width: 0; transition: flex-grow .35s var(--ease); }
.legend { list-style: none; display: grid; gap: 1rem; }
.legend li { display: grid; grid-template-columns: 1.4rem 1fr auto; gap: 1.2rem; align-items: start; }
.legend__sw { width: 1.4rem; height: 1.4rem; border-radius: 3px; margin-top: .35rem; }
.legend__title { font-size: 1.45rem; font-weight: 500; }
.legend__desc { font-size: 1.25rem; color: var(--text-3); line-height: 1.4; }
.legend__time { font-size: 1.25rem; font-weight: 700; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* === CALLOUT === */
.callout { border-left: 3px solid var(--accent); background: var(--bg-alt); border-radius: 0 var(--radius) var(--radius) 0; padding: 1.6rem 2rem; margin-bottom: 2.8rem; }
.callout__title { font-size: 1.1rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: .8rem; }
.callout p { font-size: 1.4rem; line-height: 1.5; margin-bottom: .8rem; }
.callout p:last-child { margin-bottom: 0; }
.callout code { font-family: inherit; font-weight: 500; background: var(--bg-alt2); padding: .1rem .5rem; border-radius: 3px; }
.callout .muted { color: var(--text-3); font-size: 1.3rem; }

/* === CHECKLIST === */
.checklist-section { margin-bottom: 2.8rem; }
.section-label { font-size: 1.1rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-4); margin-bottom: 1.2rem; padding-bottom: .8rem; border-bottom: 1px solid var(--border); }
.checklist-item {
  display: flex; gap: 1.2rem; align-items: flex-start; padding: 1.2rem .8rem; margin: 0 -.8rem;
  border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 4px; position: relative;
  transition: background var(--duration) var(--ease);
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item:hover { background: var(--bg-alt); }
.checklist-item input { position: absolute; opacity: 0; pointer-events: none; }
.check-box {
  width: 2rem; height: 2rem; border: 2px solid var(--text-6); border-radius: 4px; flex-shrink: 0; margin-top: .1rem;
  display: flex; align-items: center; justify-content: center; background: var(--bg); transition: all var(--duration) var(--ease);
}
.check-box::after { content: ''; width: .5rem; height: .9rem; border-right: 2.5px solid var(--on-accent); border-bottom: 2.5px solid var(--on-accent); transform: rotate(45deg) translateY(-1px); opacity: 0; transition: opacity .15s ease; }
.checklist-item.checked .check-box { background: var(--accent); border-color: var(--accent); }
.checklist-item.checked .check-box::after { opacity: 1; }
.checklist-item input:focus-visible + .check-box { outline: 2px solid var(--accent); outline-offset: 2px; }
.item-text { flex: 1; }
.item-label { font-size: 1.5rem; transition: color var(--duration) var(--ease); }
.checklist-item.checked .item-label { color: var(--text-4); text-decoration: line-through; text-decoration-color: var(--text-6); }
.item-hint { font-size: 1.25rem; color: var(--text-3); margin-top: .3rem; line-height: 1.4; }
.tag { display: inline-block; font-size: 1rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: .2rem .7rem; border-radius: 3px; margin-left: .8rem; vertical-align: middle; line-height: 1.6; }
.tag-must { background: var(--tag-must-bg); color: var(--tag-must); }
.tag-tip { background: var(--tag-tip-bg); color: var(--tag-tip); }

/* === Q&A === */
.qa details { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: .8rem; background: var(--surface); }
.qa summary { cursor: pointer; padding: 1.2rem 1.6rem; font-size: 1.45rem; font-weight: 500; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
.qa summary::-webkit-details-marker { display: none; }
.qa summary::after { content: '›'; color: var(--text-4); transition: transform var(--duration) var(--ease); }
.qa details[open] summary::after { transform: rotate(90deg); }
.qa .qa-body { padding: 0 1.6rem 1.4rem; font-size: 1.35rem; color: var(--text-2); line-height: 1.5; }
.qa .qa-body strong { font-weight: 500; color: var(--text); }

/* === DONE BANNER === */
.done-banner { display: none; border: 1.5px solid var(--ok-border); background: var(--ok-bg); color: var(--ok-text); border-radius: var(--radius); padding: 1.4rem 2rem; margin-bottom: 2.4rem; }
.done-banner.visible { display: block; }
.done-banner strong { display: block; font-size: 1.5rem; font-weight: 700; }
.done-banner span { font-size: 1.3rem; }

/* === FOOTER === */
footer.appfoot { background: var(--bg-alt); color: var(--text-3); font-size: 1.2rem; padding: 3rem 2.4rem 6rem; text-align: center; }
.ai-attribution { max-width: 640px; margin: 0 auto; text-align: left; border-top: 1px solid var(--border); padding-top: 1.2rem; }
.ai-attribution summary { cursor: pointer; font-weight: 600; color: var(--text-3); text-align: center; }
.ai-attribution p { margin: .8rem 0 0; line-height: 1.5; font-size: 1.15rem; }
.updated { margin-top: 1.2rem; }

@media (max-width: 640px) {
  .site-header { padding: 1.2rem 1.6rem; }
  .tab-bar { top: 0; position: static; }
  .tab-panel { padding: 2.4rem 1.6rem 3.2rem; }
  .legend li { grid-template-columns: 1.4rem 1fr; }
  .legend__time { grid-column: 2; }
  .budget { padding: 1.4rem; }
}
@media print {
  .site-header, .tab-bar, .panel-actions, .seg-group, .done-banner { display: none !important; }
  .tab-panel { display: block !important; padding: 1.6rem 0; break-after: page; }
  body, .wrap { background: #fff; }
}

/* === ADDITIONS : guide pour programmeur·euses === */
:root {
  --mock-bg:#ffffff; --mock-fg:#07181e; --mock-line:#c8dde6;
  --mock-bad-bg:#1d2b8f; --mock-bad-a:#ffd400; --mock-bad-b:#ff3df2; --mock-bad-c:#39ff14; --mock-bad-d:#ffffff;
}
.tab-btn { min-width: 11rem; }
.sec-title { font-size: 1.7rem; font-weight: 700; margin-bottom: .4rem; letter-spacing: -.01em; }
.sec-desc { font-size: 1.35rem; color: var(--text-3); max-width: 62ch; margin-bottom: 1.6rem; line-height: 1.5; }
.block { margin-bottom: 3.2rem; }
.note-rule { font-size: 1.25rem; color: var(--text-3); margin-bottom: 1.6rem; max-width: 70ch; }

/* matrice des couches */
.matrix-wrap { overflow-x: auto; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.matrix { border-collapse: collapse; width: 100%; min-width: 680px; font-size: 1.25rem; }
.matrix th, .matrix td { padding: 1.1rem 1.2rem; border-bottom: 1px solid var(--border); vertical-align: top; text-align: left; line-height: 1.4; }
.matrix thead th { font-size: 1.1rem; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); background: var(--bg-alt); font-weight: 700; }
.matrix tbody th { width: 24%; font-weight: 400; }
.matrix tbody tr:last-child th, .matrix tbody tr:last-child td { border-bottom: none; }
.lay__chip { display: inline-block; font-size: 1.05rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: .2rem .8rem; border-radius: 3px; margin-bottom: .6rem; }
.lay__title { display: block; font-size: 1.4rem; font-weight: 500; }
.lay__who { display: block; font-size: 1.2rem; color: var(--text-3); margin-top: .2rem; }

/* cartes de principes */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(30rem, 1fr)); gap: 1.6rem; }
.rule { border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.rule__head { padding: 1.4rem 1.6rem 1rem; }
.rule__title { font-size: 1.6rem; font-weight: 700; }
.rule__lead { font-size: 1.3rem; color: var(--text-3); margin-top: .2rem; }
.rule ul { list-style: none; }
.rule li { font-size: 1.3rem; line-height: 1.45; padding: .9rem 1.6rem; border-top: 1px solid var(--border); color: var(--text-2); }
.rule li sup { font-size: 1rem; }
.rule li sup a { text-decoration: none; font-weight: 700; }

/* outils */
.tool { border: 1.5px solid var(--border); border-radius: var(--radius); padding: 2rem; background: var(--surface); }
.tool__title { font-size: 1.5rem; font-weight: 700; }
.tool__desc { font-size: 1.3rem; color: var(--text-3); margin: .3rem 0 1.6rem; max-width: 62ch; }
.cc { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4rem; }
.cc__f { display: flex; align-items: center; gap: .8rem; margin-bottom: 1rem; font-size: 1.3rem; }
.cc__f > span { min-width: 7rem; }
.cc input[type=color] { width: 4.4rem; height: 3.2rem; border: 1.5px solid var(--border); border-radius: 4px; padding: 0; background: none; cursor: pointer; }
.cc input[type=text] { font: inherit; font-size: 1.3rem; width: 9.5rem; padding: .5rem .8rem; border: 1.5px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); }
.cc__presets { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.2rem 0; }
.cc__presets .btn-ghost { font-size: 1.2rem; padding: .5rem 1rem; }
.cc__gray { display: flex; gap: .8rem; align-items: center; font-size: 1.3rem; cursor: pointer; }
.cc__sample { border: 1.5px solid var(--border); border-radius: var(--radius); padding: 2rem; margin-bottom: 1.6rem; }
.cc__big { font-size: 2.4rem; font-weight: 700; line-height: 1.2; margin-bottom: .8rem; }
.cc__small { font-size: 1.6rem; line-height: 1.4; margin-bottom: 1.2rem; }
.cc__ui { display: inline-block; padding: .6rem 1.4rem; border: 2px solid currentColor; border-radius: 4px; font-size: 1.4rem; }
.cc__ratio { font-size: 3.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.cc__ratio small { font-size: 1.4rem; font-weight: 400; color: var(--text-3); }
.cc__checks { list-style: none; margin-top: 1.2rem; display: grid; gap: .8rem; }
.cc__checks li { font-size: 1.3rem; display: flex; gap: 1rem; align-items: baseline; }
.badge { display: inline-block; min-width: 9rem; text-align: center; font-size: 1.1rem; font-weight: 700; padding: .25rem .7rem; border-radius: 3px; flex-shrink: 0; }
.badge.ok { background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }

        en: ["Your contact details are readable at the end of the video (at least 5 seconds) and in the description", "Name, email and one link, in text large enough to read on a phone. Not only in the voice-over."] }
    ]},
    { fr: "Technique et mise en ligne", en: "Technical and publishing", items: [
      { id: "v10", tag: "tip",
        fr: ["16:9, 1080p, 30 images par seconde stables", "Vérifiez que l'interface reste lisible sur l'écran d'un téléphone."],
        en: ["16:9, 1080p, steady 30 frames per second", "Check that the interface stays readable on a phone screen."] },
      { id: "v11", tag: "must",
        fr: ["Musique et sons : créés par vous, libres de droits, ou sous licence déclarée", "La musique commerciale non autorisée peut faire bloquer ou retirer votre vidéo."],
        en: ["Music and sounds: made by you, royalty-free, or under a declared licence", "Unlicensed commercial music can get your video blocked or removed."] },
      { id: "v12", tag: "must",
        fr: ["Hébergée sur YouTube (non répertoriée) ou Vimeo; titre = nom + type de logiciel", "Description : rôle, pile technique, équipe, lien pour essayer, lien du dépôt."],
        en: ["Hosted on YouTube (unlisted) or Vimeo; title = name + type of software", "Description: role, tech stack, team, link to try it, repository link."] },
      { id: "v13", tag: "tip",
        fr: ["Vignette lisible, avec une vraie capture et trois mots au plus", "Elle s'affiche souvent en miniature : un texte fin y disparaît."],
        en: ["Readable thumbnail, with a real capture and three words at most", "It is often shown very small: thin text vanishes."] },
      { id: "v14", tag: "must",
        fr: ["Testée par une autre personne, sur téléphone, avec et sans le son", "Demandez-lui de redire le projet en une phrase. Si elle n'y arrive pas, retravaillez les 15 premières secondes."],
        en: ["Tested by someone else, on a phone, with and without sound", "Ask them to say what the project is in one sentence. If they cannot, rework the first 15 seconds."] }
    ]}
  ],
  slides: [
    { fr: "Structure des diapos", en: "Slide structure", items: [
      { id: "s1", tag: "must",
        fr: ["Une idée par diapo, et le titre est la phrase à retenir", "« Une famille planifie sa semaine en 2 minutes » plutôt que « Résultats ». Si on ne lisait que les titres, on suivrait l'histoire."],
        en: ["One idea per slide, and the title is the sentence to remember", "“A family plans its week in 2 minutes” rather than “Results”. If someone only read the titles, they would follow the story."] },
      { id: "s2", tag: "must",
        fr: ["Environ une diapo par 30 à 60 secondes", "Règle empirique : 6 à 8 diapos pour 5 minutes. Les diapos d'annexe (couche 3) ne comptent pas : elles servent aux questions."],
        en: ["Roughly one slide per 30–60 seconds", "Rule of thumb: 6–8 slides for 5 minutes. Appendix slides (layer 3) do not count: they are for questions."] },
      { id: "s3", tag: "must",
        fr: ["Ouverture sur le problème ou sur le résultat, pas sur le plan", "Pas de diapo « Agenda ». Le plan, c'est votre phrase d'ouverture."],
        en: ["Open on the problem or the result, not the outline", "No “Agenda” slide. Your opening sentence is the outline."] },
      { id: "s4", tag: "must",
        fr: ["La démo ou des captures occupent au moins la moitié des diapos", "Une capture annotée (une flèche, un cercle) vaut mieux qu'une liste de fonctionnalités."],
        en: ["The demo or screenshots take up at least half of the slides", "An annotated screenshot (an arrow, a circle) beats a feature list."] },
      { id: "s5", tag: "must",
        fr: ["Une seule diapo d'architecture, cinq boîtes au plus", "Pour les non-experts : qui parle à qui. Les détails vont en annexe."],
        en: ["A single architecture slide, five boxes at most", "For non-experts: who talks to whom. Details go in the appendix."] },
      { id: "s6", tag: "tip",
        fr: ["Code à l'écran : 8 lignes au plus, police de 20 pt ou plus, la ligne importante surlignée", "Du code illisible ne prouve rien. Mieux vaut une capture du résultat ou le lien vers le dépôt."],
        en: ["Code on screen: 8 lines at most, 20 pt font or larger, the important line highlighted", "Unreadable code proves nothing. A capture of the result or the repository link is better."] },
      { id: "s7", tag: "tip",
        fr: ["Une diapo « Sous le capot » : un seul choix, et pourquoi", "Contexte → options considérées → choix → ce que ça a coûté. Les experts adorent le dernier point."],
        en: ["One “Under the hood” slide: a single decision, and why", "Context → options considered → choice → what it cost. Experts love the last part."] },
      { id: "s8", tag: "must",
        fr: ["Dernière diapo : rôle, pile, état, lien et code QR, qui restent affichés pendant les questions", "Pas de « Merci! » ni de « Questions? » seul."],
        en: ["Last slide: role, stack, state, link and QR code, left up during questions", "No lone “Thank you!” or “Questions?”."] },
      { id: "s9", tag: "must",
        fr: ["Vos coordonnées sont sur la dernière diapo, en texte lisible, et le PDF remis porte votre nom", "Nom, courriel et un lien. Nommez le fichier avec votre nom et le projet (« nom-boite-a-lunch.pdf »)."],
        en: ["Your contact details are on the last slide, as readable text, and the PDF you hand in carries your name", "Name, email and one link. Name the file with your name and the project (“name-lunchbox.pdf”)."] }
    ]},
    { fr: "Démo en direct", en: "Live demo", items: [
      { id: "d1", tag: "must",
        fr: ["Le logiciel est installé localement et démarre sans Internet, ou la version déployée est testée dans la salle", "Le Wi-Fi d'un événement est souvent saturé. Ne comptez pas dessus."],
        en: ["The software is installed locally and starts without Internet, or the deployed version has been tested in the room", "Event Wi-Fi is often overloaded. Do not rely on it."] },
      { id: "d2", tag: "must",
        fr: ["Données de démo préchargées, compte propre, parcours de 60 à 90 secondes répété", "Aucun écran de connexion à saisir, aucune donnée bizarre (« asdf », « test 123 »)."],
        en: ["Demo data preloaded, clean account, a 60–90 second journey rehearsed", "No login screen to type into, no odd data (“asdf”, “test 123”)."] },
      { id: "d3", tag: "must",
        fr: ["Plan B : une capture vidéo du parcours est prête à lancer", "Si ça plante, vous continuez sans vous excuser : « Voici ce que ça donne. »"],
        en: ["Plan B: a screen recording of the journey is ready to play", "If it crashes, you carry on without apologizing: “Here is what it looks like.”"] },
      { id: "d4", tag: "tip",
        fr: ["Écran propre : notifications coupées, onglets et favoris masqués, zoom à 125–150 %, terminal en grande police", "Fermez tout ce qui n'est pas le sujet : la personne lit ce qu'elle voit."],
        en: ["Clean screen: notifications off, tabs and bookmarks hidden, zoom at 125–150%, terminal in a large font", "Close everything that is not the subject: people read whatever they see."] },
      { id: "d5", tag: "tip",
        fr: ["Projecteur et lumière de la salle testés d'avance", "Un gris pâle sur blanc disparaît au projecteur. Vérifiez les contrastes dans les vraies conditions."],
        en: ["Projector and room lighting tested beforehand", "Pale grey on white vanishes on a projector. Check contrast in real conditions."] },
      { id: "d6", tag: "tip",
        fr: ["Fichier de remise en PDF, avec les liens cliquables", "Évitez les surprises de polices manquantes sur l'ordinateur de la salle."],
        en: ["Hand-in file as a PDF, with clickable links", "Avoid missing-font surprises on the room's computer."] }
    ]}
  ],
  oral: [
    { fr: "Contenu", en: "Content", items: [
      { id: "o1", tag: "must",
        fr: ["Une version de 30 secondes et une de 2 minutes sont mémorisées", "Vous ne savez pas combien de temps la personne vous accordera. Commencez par la version courte."],
        en: ["A 30-second version and a 2-minute version are memorized", "You do not know how much time the person will give you. Start with the short one."] },
      { id: "o2", tag: "must",
        fr: ["L'ouverture porte sur le problème d'une personne, pas sur la technologie", "« Planifier les repas de la semaine prend une heure aux parents que je connais. J'ai construit une application qui le fait en deux minutes. »"],
        en: ["The opening is about one person's problem, not the technology", "“Planning the week's meals takes the parents I know an hour. I built an app that does it in two minutes.”"] },
      { id: "o3", tag: "must",
        fr: ["Chaque terme technique est remplacé par une image ou défini à sa première utilisation", "« Une API, c'est la porte d'entrée du serveur. » Un acronyme non défini perd une partie du public."],
        en: ["Every technical term is replaced by an image or defined on first use", "“An API is the server's front door.” An undefined acronym loses part of the audience."] },
      { id: "o4", tag: "must",
        fr: ["Une analogie du quotidien pour le point technique principal, puis le vrai nom", "File d'attente à la caisse pour une file de messages; fiches de bibliothèque pour un index de base de données."],
        en: ["An everyday analogy for the main technical point, then the real name", "A checkout queue for a message queue; library index cards for a database index."] },
      { id: "o5", tag: "must",
        fr: ["Trois ou quatre phrases décrivent ce qu'on verrait à l'écran", "« Vous ouvrez l'application, vous glissez trois recettes dans la semaine, et la liste d'épicerie se remplit toute seule. »"],
        en: ["Three or four sentences describe what one would see on screen", "“You open the app, drag three recipes into the week, and the grocery list fills itself in.”"] },
      { id: "o6", tag: "tip",
        fr: ["Un seul chiffre, arrondi, dit lentement", "« Environ 200 utilisateurs » plutôt que « 213 ». Les chiffres se retiennent mal à l'oreille."],
        en: ["One number only, rounded, said slowly", "“About 200 users” rather than “213”. Numbers are hard to retain by ear."] },
      { id: "o7", tag: "tip",
        fr: ["Annoncez la structure et répétez l'idée clé", "« Trois choses : le problème, la solution, ce que j'ai construit. » À l'écrit, on peut relire; à l'oral, la répétition fait ce travail."],
        en: ["Announce the structure and repeat the key idea", "“Three things: the problem, the solution, what I built.” On paper people can reread; out loud, repetition does that job."] },
      { id: "o8", tag: "tip",
        fr: ["Rythme posé, avec des pauses", "Règle empirique : environ 140 mots par minute, soit à peu près 70 mots pour 30 secondes et 280 pour 2 minutes."],
        en: ["Steady pace, with pauses", "Rule of thumb: about 140 words per minute, so roughly 70 words for 30 seconds and 280 for 2 minutes."] },
      { id: "o9", tag: "must",
        fr: ["Fin : votre rôle, le projet en une phrase, et comment le retrouver", "Dites le nom du projet deux fois. Comme rien n'est affiché, ayez un QR sur votre téléphone ou une carte à remettre."],
        en: ["Ending: your role, the project in one sentence, and how to find it", "Say the project name twice. Since nothing is displayed, have a QR on your phone or a card to hand over."] },
      { id: "o14", tag: "must",
        fr: ["Vous dites votre nom et comment vous joindre, et vous laissez quelque chose : carte, QR sur votre téléphone ou courriel écrit", "À l'oreille, une adresse se perd : épelez-la lentement ou montrez-la. Dites votre nom deux fois."],
        en: ["You say your name and how to reach you, and you leave something behind: a card, a QR on your phone or a written email", "By ear, an address gets lost: spell it slowly or show it. Say your name twice."] }
    ]},
    { fr: "Livraison", en: "Delivery", items: [
      { id: "o10", tag: "tip",
        fr: ["Vous regardez la personne, vous ne lisez pas vos notes", "Un plan en trois mots-clés suffit."],
        en: ["You look at the person, you do not read your notes", "A three-keyword outline is enough."] },
      { id: "o11", tag: "tip",
        fr: ["Vous adaptez la couche de détail à la personne : posez une question après la phrase d'ouverture", "« Vous êtes plutôt côté technique ou côté produit? » Puis allez à la couche 1, 2 ou 3."],
        en: ["You adjust the layer of detail to the person: ask a question after the opening sentence", "“Are you more on the technical or the product side?” Then go to layer 1, 2 or 3."] },
      { id: "o12", tag: "tip",
        fr: ["Vous adaptez la langue à votre interlocuteur·trice (FR ou EN)", "Au Québec, le français est la langue de départ; passez à l'anglais si on vous y invite."],
        en: ["You adapt the language to the person (FR or EN)", "In Québec, French is the default; switch to English if invited."] },
      { id: "o13", tag: "tip",
        fr: ["Suivi dans les 24 à 48 h", "Un courriel court avec le lien et un rappel de votre conversation."],
        en: ["Follow-up within 24–48 h", "A short email with the link and a reminder of your conversation."] }
    ]}
  ],
  poster: [
    { fr: "Contenu", en: "Content", items: [
      { id: "a1", tag: "must",
        fr: ["On comprend le projet en 5 secondes, à 2 mètres : titre + phrase en une ligne + capture principale", "Si cela exige de s'approcher, les gens passeront leur chemin."],
        en: ["The project is understood in 5 seconds, from 2 metres: title + one-line sentence + main screenshot", "If it takes stepping closer, people will walk past."] },
      { id: "a2", tag: "must",
        fr: ["Une capture principale occupe environ le tiers de l'affiche", "Plus grande qu'on ne le pense. Douze captures en miniature ne se lisent pas : choisissez-en une et annotez-la."],
        en: ["One main screenshot takes up about a third of the poster", "Larger than you think. Twelve thumbnails cannot be read: pick one and annotate it."] },
      { id: "a3", tag: "must",
        fr: ["Parcours de lecture clair : de haut en bas, de gauche à droite, 4 à 6 blocs au plus", "Voir le gabarit ci-dessus. Numérotez les blocs si l'ordre n'est pas évident."],
        en: ["Clear reading path: top to bottom, left to right, 4–6 blocks at most", "See the template above. Number the blocks if the order is not obvious."] },
      { id: "a4", tag: "must",
        fr: ["Chaque bloc porte un titre qui dit quelque chose et contient 50 à 80 mots au plus", "« Un clic au lieu de dix » plutôt que « Fonctionnalités ». Total visé : 250 à 400 mots."],
        en: ["Every block has a title that says something and holds 50–80 words at most", "“One click instead of ten” rather than “Features”. Target total: 250–400 words."] },
      { id: "a5", tag: "must",
        fr: ["Un seul diagramme d'architecture, lisible à 1 mètre", "Cinq boîtes au plus, des flèches étiquetées d'un seul mot."],
        en: ["A single architecture diagram, readable from 1 metre", "Five boxes at most, arrows labelled with a single word."] },
      { id: "a6", tag: "must",
        fr: ["Rôle, équipe, pile technique et état du projet sont dans un bandeau visible", "Même contenu que la couche 2 du tableau de l'onglet Le pitch."],
        en: ["Role, team, tech stack and project state are in a visible strip", "Same content as layer 2 of the table in The pitch tab."] },
      { id: "a7", tag: "must",
        fr: ["Un QR pour essayer et un QR pour le dépôt, d'au moins 5 à 6 cm de côté, à hauteur de main", "Règle empirique : la distance de lecture est d'environ dix fois la largeur du code. Étiquetez chaque QR en clair."],
        en: ["One QR to try it and one for the repository, at least 5–6 cm wide, at hand height", "Rule of thumb: scanning distance is roughly ten times the code's width. Label each QR in plain words."] },
      { id: "a13", tag: "must",
        fr: ["Vos coordonnées sont en clair sur l'affiche, lisibles à 1 mètre, à côté du QR", "Nom, courriel et un lien. Un code QR seul ne suffit pas : certaines personnes n'ont pas de téléphone sous la main."],
        en: ["Your contact details are printed in plain text on the poster, readable from 1 metre, next to the QR", "Name, email and one link. A QR alone is not enough: some people do not have a phone at hand."] }
    ]},
    { fr: "Impression et présence", en: "Printing and presence", items: [
      { id: "a8", tag: "must",
        fr: ["Format confirmé avec l'imprimeur (par ex. A1, 594 × 841 mm) et PDF avec polices incorporées", "Captures nettes à la taille imprimée (environ 150 ppp ou plus)."],
        en: ["Size confirmed with the printer (e.g. A1, 594 × 841 mm) and a PDF with embedded fonts", "Screenshots sharp at printed size (about 150 dpi or more)."] },
      { id: "a9", tag: "must",
        fr: ["Marges d'au moins 2 cm, rien d'important près des bords", "Les bords sont rognés, froissés ou cachés par le support."],
        en: ["Margins of at least 2 cm, nothing important near the edges", "Edges get trimmed, creased or hidden by the mount."] },
      { id: "a10", tag: "tip",
        fr: ["Test du mur : imprimez en A4, collez au mur, reculez de 2 m", "Si on ne lit pas le titre et la phrase, grossissez-les."],
        en: ["Wall test: print in A4, tape to a wall, step back 2 m", "If you cannot read the title and sentence, make them bigger."] },
      { id: "a11", tag: "tip",
        fr: ["Papier mat de préférence", "Le glacé reflète l'éclairage de la salle et rend les contrastes moins fiables."],
        en: ["Matte paper by preference", "Glossy reflects the room lighting and makes contrast less reliable."] },
      { id: "a12", tag: "tip",
        fr: ["Version orale de 30 secondes prête, et un portable avec la démo pour les curieux", "L'affiche attire, la conversation convainc."],
        en: ["30-second spoken version ready, and a laptop with the demo for the curious", "The poster attracts, the conversation convinces."] }
    ]}
  ],
  repo: [
    { fr: "Première impression (30 secondes)", en: "First impression (30 seconds)", items: [
      { id: "r1", tag: "must",
        fr: ["Le nom, la description et le champ « Website » du dépôt sont remplis", "La description reprend la phrase en une ligne du pitch. Le champ « Website » contient le lien pour essayer. Ajoutez 3 à 6 sujets (topics)."],
        en: ["The repository's name, description and “Website” field are filled in", "The description reuses the one-line sentence from the pitch. “Website” holds the link to try it. Add 3–6 topics."] },
      { id: "r2", tag: "must",
        fr: ["Le README s'ouvre sur la phrase, une capture (ou un GIF) et le lien pour essayer, sans défilement", "Pas de table des matières ni d'historique du projet en premier. Votre grand-parent doit comprendre sans faire défiler."],
        en: ["The README opens with the sentence, a screenshot (or GIF) and the link to try it, with no scrolling", "No table of contents or project history first. Your grandparent should understand without scrolling."] },
      { id: "r3", tag: "must",
        fr: ["L'état du projet est écrit dans le README", "Prototype, bêta, en production ou archivé. Même honnêteté que dans le pitch."],
        en: ["The project's state is written in the README", "Prototype, beta, in production or archived. Same honesty as in the pitch."] },
      { id: "r4", tag: "tip",
        fr: ["Le dépôt est épinglé sur votre profil, et le profil est complet (photo, nom, courte présentation)", "Quelqu'un qui clique sur votre nom doit trouver ce dépôt en premier."],
        en: ["The repository is pinned on your profile, and the profile is complete (photo, name, short bio)", "Someone who clicks your name should find this repository first."] },
      { id: "r5", tag: "tip",
        fr: ["Une capture nette, ou un GIF de 10 à 20 secondes de la démo, léger", "Les gros GIF ralentissent la page. Une bonne capture annotée suffit souvent."],
        en: ["A sharp screenshot, or a light 10–20 second GIF of the demo", "Heavy GIFs slow the page down. A good annotated screenshot is often enough."] }
    ]},
    { fr: "Le rendre solide", en: "Making it solid", items: [
      { id: "r6", tag: "must",
        fr: ["Le projet démarre depuis un clone propre en 3 à 5 commandes", "Clonez dans un dossier vide (ou sur un autre ordinateur) et suivez votre propre README mot à mot. Corrigez chaque étape qui échoue."],
        en: ["The project starts from a clean clone in 3–5 commands", "Clone into an empty folder (or on another computer) and follow your own README word for word. Fix every step that fails."] },
      { id: "r7", tag: "must",
        fr: ["Un fichier .env.example liste les variables sans valeurs secrètes, et .gitignore exclut .env, les builds et les dépendances installées", "Une personne doit savoir quoi configurer sans jamais voir vos vraies clés."],
        en: [".env.example lists the variables without secret values, and .gitignore excludes .env, builds and installed dependencies", "Someone should know what to configure without ever seeing your real keys."] },
      { id: "r8", tag: "must",
        fr: ["Un fichier LICENSE est présent", "Sans licence, personne n'a le droit de réutiliser votre code. MIT est un choix courant pour un portfolio. Pour un travail de cours ou d'équipe, vérifiez d'abord avec vos coéquipier·ères et l'établissement."],
        en: ["A LICENSE file is present", "Without a licence, nobody has the right to reuse your code. MIT is a common choice for a portfolio. For coursework or team projects, check with your teammates and the institution first."] },
      { id: "r9", tag: "must",
        fr: ["Des tests (ou, à défaut, des vérifications manuelles documentées) et la commande pour les lancer", "Même quelques tests qui passent montrent que vous savez ce que « ça marche » veut dire."],
        en: ["Tests (or, failing that, documented manual checks) and the command to run them", "Even a few passing tests show you know what “it works” means."] },
      { id: "r10", tag: "tip",
        fr: ["Intégration continue (CI) qui passe, avec un badge", "Une coche verte vaut mille mots. Un badge rouge est pire que pas de badge : réparez-le ou retirez-le."],
        en: ["Continuous integration (CI) that passes, with a badge", "A green check says a lot. A red badge is worse than no badge: fix it or remove it."] },
      { id: "r11", tag: "tip",
        fr: ["Structure lisible : dossiers bien nommés, pas de fichiers morts, pas de gros binaires ni de dépendances versionnées", "Un dossier « docs » pour le diagramme d'architecture et les captures."],
        en: ["Readable structure: well-named folders, no dead files, no large binaries or committed dependencies", "A “docs” folder for the architecture diagram and screenshots."] },
      { id: "r12", tag: "tip",
        fr: ["Dépendances verrouillées et version du langage indiquée", "Fichier de verrouillage (package-lock.json, requirements.txt avec versions…) et la version de Node, Python, etc. dans le README."],
        en: ["Dependencies locked and language version stated", "A lock file (package-lock.json, requirements.txt with versions…) and the Node, Python, etc. version in the README."] },
      { id: "r13", tag: "tip",
        fr: ["Un tag ou une release pour la version montrée dans le pitch", "Le lien du pitch renvoie alors toujours à ce qu'on a vu, même si le code évolue ensuite."],
        en: ["A tag or release for the version shown in the pitch", "The pitch link then always points to what was shown, even if the code changes later."] }
    ]},
    { fr: "Historique et sécurité", en: "History and security", items: [
      { id: "r14", tag: "must",
        fr: ["Aucun secret dans le dépôt, ni dans son historique : clés d'API, mots de passe, jetons, .env", "Supprimer le fichier dans un nouveau commit ne suffit pas : il reste dans l'historique. Révoquez et remplacez la clé d'abord, puis nettoyez l'historique."],
        en: ["No secret in the repository or its history: API keys, passwords, tokens, .env", "Deleting the file in a new commit is not enough: it stays in the history. Revoke and replace the key first, then clean the history."] },
      { id: "r15", tag: "must",
        fr: ["Aucune donnée personnelle réelle : jeux de données, captures, journaux", "Utilisez des données fictives réalistes, comme pour la démo."],
        en: ["No real personal data: datasets, screenshots, logs", "Use realistic fictional data, as for the demo."] },
      { id: "r16", tag: "tip",
        fr: ["Historique de commits lisible : messages clairs, pas de « fix fix fix » en rafale", "Vous pouvez regrouper des commits (squash) avant la mise en vitrine si le dépôt est le vôtre. Ne réécrivez jamais l'historique d'un dépôt partagé sans prévenir l'équipe."],
        en: ["Readable commit history: clear messages, no “fix fix fix” bursts", "You may squash commits before showcasing if the repository is yours. Never rewrite the history of a shared repository without telling the team."] },
      { id: "r17", tag: "tip",
        fr: ["Votre contribution est visible, et les composantes externes ou générées par IA sont déclarées", "Dans un projet d'équipe, la section « Mon rôle » du README dit ce que vous avez fait. Mêmes règles d'intégrité que pour le pitch."],
        en: ["Your contribution is visible, and external or AI-generated components are declared", "In a team project, the README's “My role” section says what you did. Same integrity rules as for the pitch."] }
    ]},
    { fr: "Lier le dépôt", en: "Linking the repository", items: [

          <label class="cc__f"><span>${fr ? "Texte" : "Text"}</span><input type="color" id="ccFg" value="${cc.fg}"><input type="text" id="ccFgHex" maxlength="7" value="${cc.fg}" aria-label="${fr ? "Couleur du texte (hexadécimal)" : "Text colour (hex)"}"></label>
          <label class="cc__f"><span>${fr ? "Fond" : "Background"}</span><input type="color" id="ccBg" value="${cc.bg}"><input type="text" id="ccBgHex" maxlength="7" value="${cc.bg}" aria-label="${fr ? "Couleur du fond (hexadécimal)" : "Background colour (hex)"}"></label>
          <div class="cc__presets" id="ccPresets">${CC_PRESETS.map((p, i) => `<button type="button" class="btn-ghost" data-preset="${i}">${esc(L(p.l))}</button>`).join("")}</div>
          <label class="cc__gray"><input type="checkbox" id="ccGray"${cc.gray ? " checked" : ""}><span>${fr ? "Aperçu en niveaux de gris (test 2)" : "Greyscale preview (test 2)"}</span></label>
        </div>
        <div>
          <div class="cc__sample" id="ccSample">
            <p class="cc__big">${fr ? "Boîte à lunch" : "Lunchbox"}</p>
            <p class="cc__small">${fr ? "Planifiez la semaine en deux minutes, sans tableur." : "Plan your week in two minutes, no spreadsheet."}</p>
            <span class="cc__ui">${fr ? "Essayer" : "Try it"}</span>
          </div>
          <div class="cc__ratio" id="ccRatio"></div>
          <ul class="cc__checks" id="ccChecks"></ul>
        </div>
      </div>
    </div>`;

  const types = `<div class="block">
      <div class="sec-title">${fr ? "Tailles de texte : points de départ par support" : "Text sizes: starting points per material"}</div>
      <p class="sec-desc">${fr ? "Règles empiriques, pas des normes. Validez-les par un vrai test : projetez, imprimez, regardez sur un téléphone." : "Rules of thumb, not standards. Validate them with a real test: project, print, view on a phone."}</p>
      <div class="tbl-wrap"><table class="typetbl"><thead><tr>
        <th scope="col">${fr ? "Support" : "Material"}</th><th scope="col">${fr ? "Titre" : "Title"}</th><th scope="col">${fr ? "Texte" : "Body"}</th><th scope="col">${fr ? "Minimum" : "Minimum"}</th><th scope="col">${fr ? "Note" : "Note"}</th></tr></thead>
        <tbody>${TYPES.map(r => `<tr><th scope="row">${esc(L(r.s))}</th>
          <td class="num">${esc(typeof r.a === "string" ? r.a : L(r.a))}</td><td class="num">${esc(typeof r.b === "string" ? r.b : L(r.b))}</td><td class="num">${esc(typeof r.c === "string" ? r.c : L(r.c))}</td><td>${esc(L(r.n))}</td></tr>`).join("")}</tbody></table></div>
    </div>`;

  const mocks = `<div class="block">
      <div class="sec-title">${fr ? "La même diapo, deux façons" : "The same slide, two ways"}</div>
      <p class="sec-desc">${fr ? "Couleurs, polices, espace et détail se jouent ensemble. La diapo de gauche passe le test des yeux plissés; celle de droite ne le passe pas." : "Colour, type, space and detail work together. The left slide passes the squint test; the right one does not."}</p>
      <div class="mockpair">
        <div class="mockcol">
          <h4>${fr ? "À viser" : "Aim for this"}</h4>
          <div class="mock mock--good" role="img" aria-label="${fr ? "Diapo dégagée : un titre, une phrase, une grande capture" : "Clean slide: one title, one sentence, one large screenshot"}">
            <div class="m-title">${fr ? "Une famille planifie sa semaine en 2 minutes" : "A family plans its week in 2 minutes"}</div>
            <div class="m-sub">${fr ? "Boîte à lunch · application web" : "Lunchbox · web app"}</div>
            <div class="m-shot"><i></i><i></i></div>
          </div>
          <ul class="mocknotes">
            <li><b>✓</b>${fr ? "Titre = message à retenir" : "Title = the message to remember"}</li>
            <li><b>✓</b>${fr ? "Une seule police, deux couleurs, un fort contraste" : "One typeface, two colours, strong contrast"}</li>
            <li><b>✓</b>${fr ? "La capture occupe la moitié de la diapo" : "The screenshot takes half the slide"}</li>
            <li><b>✓</b>${fr ? "Marges généreuses, une idée" : "Generous margins, one idea"}</li>
          </ul>
        </div>
        <div class="mockcol">
          <h4>${fr ? "À éviter" : "Avoid this"}</h4>
          <div class="mock mock--bad" role="img" aria-label="${fr ? "Diapo surchargée : texte minuscule, quatre polices, couleurs néon" : "Overloaded slide: tiny text, four typefaces, neon colours"}">
            <div class="b-t">${fr ? "Notre application (v1.3.2-beta) : fonctionnalités" : "Our application (v1.3.2-beta): features"}</div>
            <p class="b1">• React 18, Redux, Node.js, Express, MongoDB, JWT, Docker</p>
            <p class="b2">• CI/CD GitHub Actions, Redis, Kubernetes, Nginx, Jest</p>
            <p class="b3">• ${fr ? "Authentification, planification, notifications, exportation" : "Authentication, planning, notifications, export"}</p>
            <p class="b4">• ${fr ? "Tableau de bord, rôles, API REST, tests de charge, i18n" : "Dashboard, roles, REST API, load tests, i18n"}</p>
            <p class="b1">• ${fr ? "Prochaine étape : migration vers microservices" : "Next step: migration to microservices"}</p>
          </div>
          <ul class="mocknotes">
            <li><b>✗</b>${fr ? "Étiquette (« fonctionnalités ») au lieu d'un message" : "A label (“features”) instead of a message"}</li>
            <li><b>✗</b>${fr ? "Quatre polices et des couleurs néon sur fond bleu" : "Four typefaces and neon colours on blue"}</li>
            <li><b>✗</b>${fr ? "Liste de technologies sans aucune image du produit" : "A list of technologies with no image of the product"}</li>
            <li><b>✗</b>${fr ? "Texte minuscule, aucune marge, dix idées" : "Tiny text, no margins, ten ideas"}</li>
          </ul>
        </div>
      </div>
    </div>`;

  return `<div class="block">
      <div class="sec-title">${fr ? "Quatre familles de principes" : "Four families of principles"}</div>
      <p class="note-rule">${fr ? "Les éléments suivis d'un numéro [n] s'appuient sur la source correspondante, en bas de page. Les autres sont des règles empiriques d'usage courant, pas des normes." : "Items followed by a number [n] rest on the matching source at the bottom of the page. The others are common rules of thumb, not standards."}</p>
      <div class="rules">${rules}</div>
    </div>
    ${mocks}
    <div class="block">${tool}</div>
    ${types}`;
}
function designBottom(){
  const fr = currentLang === "fr";
  return `<div class="block" style="margin-top:2.8rem">
      <div class="section-label">${fr ? "Sources" : "Sources"}</div>
      <ol class="sources" style="list-style:none">${SOURCES.filter(s => !s.tab).map(s => `<li id="src-${s.n}"><span>[${s.n}]</span><span>${esc(currentLang === "en" && s.en ? s.en : s.t)} <a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a></span></li>`).join("")}</ol>
      <p class="note-rule" style="margin-top:1.2rem">${fr ? "Les sous-titres pour les contenus préenregistrés sont aussi exigés par la source [4]." : "Captions for prerecorded content are also required by source [4]."}</p>
    </div>`;
}

/* ---------- Outil de contraste ---------- */
function normHex(h){
  h = String(h).trim();
  if (/^#[0-9a-f]{3}$/i.test(h)) h = "#" + h[1]+h[1] + h[2]+h[2] + h[3]+h[3];
  return /^#[0-9a-f]{6}$/i.test(h) ? h.toLowerCase() : null;
}
function lum(hex){
  const c = [1,3,5].map(i => parseInt(hex.substr(i,2),16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function ratioOf(a, b){ const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function updateContrast(){
  const fr = currentLang === "fr";
  const s = document.getElementById("ccSample");
  if (!s) return;
  s.style.color = cc.fg; s.style.background = cc.bg;
  s.style.filter = cc.gray ? "grayscale(1)" : "none";
  const r = ratioOf(cc.fg, cc.bg);
  const shown = Math.floor(r * 100) / 100;
  document.getElementById("ccRatio").innerHTML = nf(shown, 2) + " : 1";
  const tests = [
    { min: 4.5, l: fr ? "Texte courant (AA)" : "Body text (AA)", th: "4,5:1" },
    { min: 3,   l: fr ? "Grand texte (AA)" : "Large text (AA)", th: "3:1" },
    { min: 3,   l: fr ? "Éléments d'interface (AA)" : "UI elements (AA)", th: "3:1" },
    { min: 7,   l: fr ? "Texte courant, niveau élevé (AAA)" : "Body text, enhanced (AAA)", th: "7:1" }
  ];
  document.getElementById("ccChecks").innerHTML = tests.map(x => {
    const ok = r >= x.min;
    return `<li><span class="badge ${ok ? "ok" : "ko"}">${ok ? "✓ " + (fr ? "Réussi" : "Pass") : "✗ " + (fr ? "Échec" : "Fail")}</span><span>${esc(x.l)} · ${x.th.replace(",", currentLang === "en" ? "." : ",")}</span></li>`;
  }).join("");
  document.getElementById("ccFg").value = cc.fg; document.getElementById("ccBg").value = cc.bg;
}
function initContrast(){
  const fg = document.getElementById("ccFg"), bg = document.getElementById("ccBg");
  const fgH = document.getElementById("ccFgHex"), bgH = document.getElementById("ccBgHex");
  fg.addEventListener("input", () => { cc.fg = fg.value; fgH.value = cc.fg; updateContrast(); });
  bg.addEventListener("input", () => { cc.bg = bg.value; bgH.value = cc.bg; updateContrast(); });
  fgH.addEventListener("input", () => { const h = normHex(fgH.value); if (h){ cc.fg = h; updateContrast(); } });
  bgH.addEventListener("input", () => { const h = normHex(bgH.value); if (h){ cc.bg = h; updateContrast(); } });
  document.getElementById("ccGray").addEventListener("change", e => { cc.gray = e.target.checked; updateContrast(); });
  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
    const p = CC_PRESETS[+b.dataset.preset];
    cc.fg = p.fg; cc.bg = p.bg; fgH.value = cc.fg; bgH.value = cc.bg; updateContrast();
  }));
  updateContrast();
}

/* ---------- Rendu global ---------- */
const PANELS = {
  pitch:  () => shell("pitch",  pitchTop(), ""),
  video:  () => shell("video",  videoTop(), ""),
  slides: () => shell("slides", "", ""),
  oral:   () => shell("oral",   "", oralBottom()),
  poster: () => shell("poster", posterTop(), ""),
  repo:   () => shell("repo",   repoTop(), repoBottom()),
  design: () => shell("design", designTop(), designBottom())
};
function applyStaticI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.documentElement.lang = currentLang === "en" ? "en-CA" : "fr-CA";
  document.title = currentLang === "en" ? "Pitching your software · Career Tools" : "Présenter son logiciel · Outils carrière";
}
function fullRender(){
  TABS.forEach(tb => {
    document.getElementById("panel-" + tb.id).innerHTML = PANELS[tb.id]();
    renderList(tb.id);
  });
  renderBudget();
  initContrast();
  renderTabs(); showTab(); renderProgress(); updateThemeButton();
}
function applyLanguage(lang){
  currentLang = lang;
  lsSet("lang", lang);
  applyStaticI18n();
  document.getElementById("btnLangFr").classList.toggle("active", lang === "fr");
  document.getElementById("btnLangEn").classList.toggle("active", lang === "en");
  document.getElementById("btnLangFr").setAttribute("aria-pressed", lang === "fr");
  document.getElementById("btnLangEn").setAttribute("aria-pressed", lang === "en");
  fullRender();
}
document.getElementById("btnLangFr").addEventListener("click", () => applyLanguage("fr"));
document.getElementById("btnLangEn").addEventListener("click", () => applyLanguage("en"));

/* ---------- Thème ---------- */
function isDarkTheme(){ return document.documentElement.getAttribute("data-theme") === "dark"; }
function updateThemeButton(){
  const dark = isDarkTheme();
  document.getElementById("themeIcon").textContent = dark ? "☀️" : "🌙";
  document.getElementById("themeLabel").textContent = dark ? t("themeLight") : t("themeDark");
}
function initTheme(){
  const saved = lsGet("theme");
  const theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeButton();
}
document.getElementById("btnThemeToggle").addEventListener("click", () => {
  const next = isDarkTheme() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  lsSet("theme", next);
  updateThemeButton(); // tout passe par des variables CSS : aucun visuel dessiné en JS à redessiner
});

/* ---------- Actions (délégation) ---------- */
document.addEventListener("click", e => {
  const r = e.target.closest("[data-reset]");
  if (r){
    tabIds(r.dataset.reset).forEach(id => checked.delete(id));
    saveChecked(); renderList(r.dataset.reset); renderProgress(); renderTabs();
    return;
  }
  const cp = e.target.closest("[data-copy]");
  if (cp){
    const txt = document.getElementById(cp.dataset.copy).textContent;
    const done = () => { const old = cp.textContent; cp.textContent = currentLang === "fr" ? "Copié ✓" : "Copied ✓"; setTimeout(() => { cp.textContent = old; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => {});
    else { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch(err){} document.body.removeChild(ta); }
    return;
  }
  if (e.target.closest("[data-print]")) window.print();
});

/* ---------- Démarrage ---------- */
initTheme();
const savedLang = lsGet("lang");
applyLanguage(savedLang === "en" ? "en" : "fr");

</script>
